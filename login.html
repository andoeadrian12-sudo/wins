
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | WINS HOST</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #090909;
      color: white;
      font-family: Arial, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 35px;
      background: #151515;
      border: 1px solid #333;
      border-radius: 14px;
    }
    h1 { text-align: center; }
    h1 span { color: #e32636; }
    p { text-align: center; color: #aaa; }
    input {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      background: #090909;
      border: 1px solid #333;
      border-radius: 7px;
      color: white;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      background: #e32636;
      color: white;
      border: 0;
      border-radius: 7px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    #mensagem { font-size: 14px; }
    a { color: #ff4655; }
  </style>
</head>
<body>
  <main class="card">
    <h1>WINS <span>HOST</span></h1>
    <p>Entre na sua conta.</p>

    <form id="formLogin">
      <input id="email" type="email" placeholder="Seu e-mail" required>
      <input id="senha" type="password" placeholder="Sua senha" required>
      <button id="botao" type="submit">ENTRAR</button>
    </form>

    <p id="mensagem" aria-live="polite"></p>
    <p>Não tem conta? <a href="cadastro.html">Criar conta</a></p>
  </main>

  <script type="module">
    import { createClient } from
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://ykcibycbqhvdkajidqnm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_7yZlCDzDq2pnaRRSJH-CLw_KO7ZaEuP';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('formLogin');
    const mensagem = document.getElementById('mensagem');
    const botao = document.getElementById('botao');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      mensagem.textContent = '';
      botao.disabled = true;
      botao.textContent = 'ENTRANDO...';

      try {
        const { error } = await supabase.auth.signInWithPassword({
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('senha').value
        });

        if (error) throw error;

        mensagem.textContent = 'Login realizado! Abrindo painel...';
        window.location.href = 'painel.html';
      } catch (error) {
        mensagem.textContent = 'Erro: ' + error.message;
      } finally {
        botao.disabled = false;
        botao.textContent = 'ENTRAR';
      }
    });
  </script>
</body>
</html>
